<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProxyQR | Smart Classroom Attendance Portal</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            obsidian: '#07090e',
            midnight: '#0d121d',
            panel: '#101624'
          }
        }
      }
    }
  </script>
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- External and Inline Fallback CSS for 100% Guaranteed Dark Styling -->
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');
    html, body {
      background-color: #07090e !important;
      color: #f1f5f9 !important;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      margin: 0;
    }
    .bg-mesh-dark {
      background-color: #07090e;
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.18), transparent 70%),
        radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.10) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.08) 0%, transparent 45%);
      background-attachment: fixed;
    }
    .glass-card {
      background: rgba(13, 18, 30, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
    }
    .glow-btn {
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
    }
    .glow-btn:hover {
      box-shadow: 0 15px 35px -5px rgba(99, 102, 241, 0.6);
    }
  </style>
</head>
<body class="bg-mesh-dark flex flex-col justify-between min-h-screen p-4 sm:p-6 lg:p-8">

  <!-- Header / Brand -->
  <header class="w-full max-w-5xl mx-auto flex items-center justify-between py-2">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-violet-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25 border border-indigo-400/20">
        <i class="fa-solid fa-qrcode text-lg"></i>
      </div>
      <div>
        <span class="text-xl font-extrabold tracking-tight text-white flex items-center gap-1">
          Proxy<span class="text-indigo-400">QR</span>
        </span>
        <p class="text-[11px] text-slate-400 font-medium hidden sm:block">Automated Real-Time Classroom Attendance</p>
      </div>
    </div>
    <div class="flex items-center space-x-2 text-xs">
      <span class="inline-flex items-center px-3 py-1 rounded-full font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
        <span class="w-1.5 h-1.5 mr-2 bg-emerald-400 rounded-full animate-pulse"></span> Academic Portal
      </span>
    </div>
  </header>

  <!-- Login Card Container -->
  <main class="w-full max-w-md mx-auto my-auto py-6">
    <div class="glass-card rounded-3xl p-6 sm:p-8 relative overflow-hidden">
      <!-- Top Glowing Indigo Accent Border -->
      <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-indigo-500 via-violet-500 to-cyan-500"></div>

      <div class="text-center mb-6">
        <h1 class="text-2xl font-black text-white tracking-tight" id="loginTitle">Welcome Back</h1>
        <p class="text-xs text-slate-400 mt-1" id="loginSubtitle">Sign in to mark or manage lecture attendance</p>
      </div>

      <!-- Role Selector Tabs -->
      <div class="grid grid-cols-2 gap-1.5 p-1 bg-slate-950/80 rounded-2xl border border-slate-800/80 mb-6">
        <button id="studentTab" type="button" class="py-2.5 text-xs sm:text-sm font-semibold rounded-xl transition-all duration-200 bg-indigo-600 text-white shadow-md shadow-indigo-600/30 flex items-center justify-center gap-2">
          <i class="fa-solid fa-user-graduate"></i> Student
        </button>
        <button id="teacherTab" type="button" class="py-2.5 text-xs sm:text-sm font-semibold rounded-xl transition-all duration-200 text-slate-400 hover:text-white flex items-center justify-center gap-2">
          <i class="fa-solid fa-chalkboard-user"></i> Faculty
        </button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-4">
        <div>
          <label id="identifierLabel" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">
            Student Roll Number
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500" id="identifierIcon">
              <i class="fa-solid fa-id-card"></i>
            </span>
            <input 
              type="text" 
              id="identifier" 
              required 
              placeholder="e.g. 251620101035"
              class="w-full pl-10 pr-4 py-3 bg-slate-950/70 border border-slate-800 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all font-mono"
            >
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">
              Password
            </label>
          </div>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input 
              type="password" 
              id="password" 
              required 
              placeholder="••••••••"
              class="w-full pl-10 pr-10 py-3 bg-slate-950/70 border border-slate-800 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"
            >
            <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300">
              <i class="fa-regular fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <!-- Alert Banner -->
        <div id="errorAlert" class="hidden p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-start gap-2.5">
          <i class="fa-solid fa-circle-exclamation mt-0.5 text-rose-400"></i>
          <span id="errorMessage">Invalid credentials.</span>
        </div>

        <button 
          type="submit" 
          id="submitBtn"
          class="w-full py-3 px-4 bg-gradient-to-r from-indigo-600 via-indigo-500 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold text-sm rounded-xl glow-btn transition-all duration-200 transform active:scale-[0.99] flex items-center justify-center gap-2"
        >
          <span>Sign In to Portal</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>

      <!-- Quick Demo Access Pills -->
      <div class="mt-6 pt-5 border-t border-slate-800/80">
        <p class="text-xs text-slate-400 font-semibold mb-2.5 flex items-center justify-between">
          <span>Demo Accounts</span>
          <span class="text-[10px] text-indigo-400 font-normal">Click to auto-fill</span>
        </p>
        <div class="flex flex-col gap-1.5 text-xs">
          <button type="button" onclick="fillCredentials('student', '251620101035', 'Student@123')" class="w-full px-3 py-2.5 rounded-xl bg-slate-950/60 hover:bg-slate-900 border border-slate-800/80 hover:border-indigo-500/30 text-slate-300 flex items-center justify-between transition-all text-left">
            <span class="truncate">🎓 Rajpreet Singh (251620101035)</span>
            <span class="text-[10px] text-indigo-400 uppercase font-mono ml-2">Student</span>
          </button>
          <button type="button" onclick="fillCredentials('student', '251620101008', 'Student@123')" class="w-full px-3 py-2.5 rounded-xl bg-slate-950/60 hover:bg-slate-900 border border-slate-800/80 hover:border-indigo-500/30 text-slate-300 flex items-center justify-between transition-all text-left">
            <span class="truncate">🎓 Arvind Verma (251620101008)</span>
            <span class="text-[10px] text-indigo-400 uppercase font-mono ml-2">Student</span>
          </button>
          <button type="button" onclick="fillCredentials('teacher', 'abhijeet@college.edu', 'Faculty@123')" class="w-full px-3 py-2.5 rounded-xl bg-slate-950/60 hover:bg-slate-900 border border-slate-800/80 hover:border-indigo-500/30 text-slate-300 flex items-center justify-between transition-all text-left">
            <span class="truncate">👨‍🏫 Prof. Abhijeet Kushawah</span>
            <span class="text-[10px] text-violet-400 uppercase font-mono ml-2">Faculty</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full max-w-5xl mx-auto text-center py-4 text-xs text-slate-500">
    <p>ProxyQR Dynamic Attendance System &bull; Academic Project</p>
  </footer>

  <script src="./js/config.js"></script>
  <script src="/js/config.js"></script>
  <script src="./js/auth.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    let activeRole = "student";

    const studentTab = document.getElementById("studentTab");
    const teacherTab = document.getElementById("teacherTab");
    const identifierLabel = document.getElementById("identifierLabel");
    const identifierInput = document.getElementById("identifier");
    const identifierIcon = document.getElementById("identifierIcon");
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const eyeIcon = document.getElementById("eyeIcon");
    const loginForm = document.getElementById("loginForm");
    const submitBtn = document.getElementById("submitBtn");
    const errorAlert = document.getElementById("errorAlert");
    const errorMessage = document.getElementById("errorMessage");

    function setRole(role) {
      activeRole = role;
      errorAlert.classList.add("hidden");
      if (role === "student") {
        studentTab.className = "py-2.5 text-xs sm:text-sm font-semibold rounded-xl transition-all duration-200 bg-indigo-600 text-white shadow-md shadow-indigo-600/30 flex items-center justify-center gap-2";
        teacherTab.className = "py-2.5 text-xs sm:text-sm font-semibold rounded-xl transition-all duration-200 text-slate-400 hover:text-white flex items-center justify-center gap-2";
        identifierLabel.innerText = "Student Roll Number";
        identifierInput.placeholder = "e.g. 251620101035";
        identifierIcon.innerHTML = '<i class="fa-solid fa-id-card"></i>';
      } else {
        teacherTab.className = "py-2.5 text-xs sm:text-sm font-semibold rounded-xl transition-all duration-200 bg-indigo-600 text-white shadow-md shadow-indigo-600/30 flex items-center justify-center gap-2";
        studentTab.className = "py-2.5 text-xs sm:text-sm font-semibold rounded-xl transition-all duration-200 text-slate-400 hover:text-white flex items-center justify-center gap-2";
        identifierLabel.innerText = "Faculty Official Email";
        identifierInput.placeholder = "e.g. abhijeet@college.edu";
        identifierIcon.innerHTML = '<i class="fa-solid fa-envelope"></i>';
      }
    }

    studentTab.addEventListener("click", () => setRole("student"));
    teacherTab.addEventListener("click", () => setRole("teacher"));

    togglePassword.addEventListener("click", () => {
      const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
      passwordInput.setAttribute("type", type);
      eyeIcon.className = type === "password" ? "fa-regular fa-eye" : "fa-regular fa-eye-slash";
    });

    function fillCredentials(role, id, pw) {
      setRole(role);
      identifierInput.value = id;
      passwordInput.value = pw;
      errorAlert.classList.add("hidden");
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorAlert.classList.add("hidden");

      const identifier = identifierInput.value.trim();
      const password = passwordInput.value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...';

      try {
        // Detect if deployed without configured backend URL
        const isLocal = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
        if (!isLocal && !CONFIG.API_BASE) {
          throw new Error("Backend URL not configured! Please open 'frontend/js/config.js' and set your live Render backend URL in CONFIG.API_BASE.");
        }

        const apiUrl = getApiUrl("/api/auth/login");
        const res = await fetch(apiUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ identifier, password })
        });

        // Safely parse JSON or text
        const text = await res.text();
        let data = {};
        try {
          data = text ? JSON.parse(text) : {};
        } catch {
          if (res.status === 404) {
            throw new Error(`API endpoint not found (404). Check that your backend is running at ${CONFIG.API_BASE || window.location.origin}`);
          } else if (res.status >= 500) {
            throw new Error(`Backend server error (${res.status}). The server may be starting up, please wait a moment and try again.`);
          } else {
            throw new Error(`Server returned unexpected response (${res.status}).`);
          }
        }

        if (!res.ok) {
          throw new Error(data.detail || `Authentication failed (${res.status})`);
        }

        Auth.setSession(data.access_token, data.user);

        if (data.user.role === "teacher") {
          window.location.href = "./teacher/dashboard.html";
        } else {
          window.location.href = "./student/dashboard.html";
        }
      } catch (err) {
        errorMessage.innerText = err.message;
        errorAlert.classList.remove("hidden");
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Sign In to Portal</span> <i class="fa-solid fa-arrow-right text-xs"></i>';
      }
    });

    // Check existing login
    try {
      const existingUser = Auth.getUser();
      if (existingUser && Auth.getToken()) {
        if (existingUser.role === "teacher") {
          window.location.href = "./teacher/dashboard.html";
        } else {
          window.location.href = "./student/dashboard.html";
        }
      }
    } catch(e) {}
  </script>
</body>
</html>
